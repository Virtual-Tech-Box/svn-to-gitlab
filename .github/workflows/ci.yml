name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full suite including real SVN -> Git conversions, across the supported Python
  # versions. No platform installs git-svn any more: it is not needed to convert,
  # Git for Windows removed it in v2.54.0, and keeping it installable here meant
  # pinning git to an old release. The native engine's output is locked down by the
  # golden-master trees instead.
  test-linux:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Subversion
        run: |
          set -euxo pipefail
          # Modern git, as shipped by the runner. We deliberately do NOT hold git
          # back to a version old enough to satisfy Ubuntu's git-svn package: the
          # native engine does not use git-svn, and testing against a git nobody
          # runs would be worse than useless. Correctness is anchored by
          # tests/test_golden_master.py, which pins the exact trees the conversion
          # must produce.
          sudo apt-get update
          sudo apt-get install -y subversion git-lfs
          git --version

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Show detected tools
        run: svn2gitlab doctor

      - name: Run the test suite
        run: pytest -v --junit-xml=results.xml --cov=svn2gitlab --cov-report=term-missing

      - name: Confirm the conversion suite actually ran
        run: python tests/assert_suite_ran.py results.xml

  # The other platforms matter because the tool is used on Windows servers and
  # developer Macs. One Python version each is enough to catch path, line-ending and
  # process-handling differences.
  test-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Subversion
        run: brew install subversion git-lfs
      - run: pip install -e ".[dev]"
      # Must pass without git-svn. If it does not, that is the bug.
      - run: svn2gitlab doctor
      - run: pytest -v --junit-xml=results.xml

      - name: Confirm the conversion suite actually ran
        run: python tests/assert_suite_ran.py results.xml

  test-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Subversion
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install svn --no-progress -y
          # Chocolatey edits the machine PATH, but this process inherited its
          # environment before that happened, so svn.exe stays invisible for the rest
          # of the job unless we publish the directory ourselves. Getting this wrong
          # is what made the whole Windows job pass while the tool could not run.
          $found = Get-ChildItem -Path @(
              "${env:ProgramFiles}\*\bin\svn.exe",
              "${env:ProgramFiles(x86)}\*\bin\svn.exe",
              "C:\ProgramData\chocolatey\bin\svn.exe",
              "C:\tools\*\bin\svn.exe"
            ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { throw "svn.exe was not found after installing Subversion" }
          Write-Host "svn found at $($found.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $found.Directory.FullName

      - run: pip install -e ".[dev]"

      # A real gate. `doctor` exits non-zero when a required tool is missing, and a
      # Windows job that cannot convert a repository must not report success.
      - name: Check the toolchain
        run: svn2gitlab doctor

      - name: Run the test suite
        run: pytest -v --junit-xml=results.xml

      - name: Confirm the conversion suite actually ran
        run: python tests/assert_suite_ran.py results.xml

  # Prove the frozen build still starts. A PyInstaller bundle can import cleanly in
  # CI and still fail at runtime on a missing hidden import, so it is smoke-tested.
  build-frozen:
    name: Frozen build smoke test
    # Matches the release build: the artifact has to start on Windows Server 2016.
    runs-on: windows-2022
    needs: [test-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bundle Git (MinGit) into the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Downloaded at BUILD time and shipped inside the package, so installation
          # needs no internet at all. The client site runs behind a VPN that blocks
          # public DNS, where download-on-demand simply cannot work - and a migration
          # host is exactly the kind of machine that is locked down.
          #
          # MinGit is Git for Windows' own redistributable, published for embedding.
          # `git fast-import`, which the converter depends on, is a builtin of
          # git.exe rather than a separate binary, so MinGit is sufficient.
          $tag = "v2.55.0.windows.5"
          $name = "MinGit-2.55.0.5-64-bit.zip"
          $url = "https://github.com/git-for-windows/git/releases/download/$tag/$name"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile mingit.zip -MaximumRedirection 5
          $sha = (Get-FileHash mingit.zip -Algorithm SHA256).Hash
          Write-Host "MinGit SHA256: $sha"

          $vendor = "installer/vendor/git"
          if (Test-Path $vendor) { Remove-Item -Recurse -Force $vendor }
          New-Item -ItemType Directory -Path $vendor -Force | Out-Null
          Expand-Archive -Path mingit.zip -DestinationPath $vendor -Force

          foreach ($required in @("cmd/git.exe", "mingw64/bin/git.exe", "LICENSE.txt")) {
            if (-not (Test-Path (Join-Path $vendor $required))) {
              throw "MinGit is missing $required - refusing to ship an incomplete Git"
            }
          }
          # GPLv2 obliges us to ship the licence with the binary and to say where the
          # corresponding source is. Both travel with the package.
          Copy-Item (Join-Path $vendor "LICENSE.txt") (Join-Path $vendor "GIT-LICENSE.txt")
          # Built as an array rather than a here-string: PowerShell requires the
          # closing "@ at column zero, which cannot coexist with YAML indentation.
          $offer = @(
            "This package includes Git for Windows (MinGit) $name, unmodified.",
            "",
            "Git is free software under the GNU General Public License version 2.",
            "Its licence travels with this file as GIT-LICENSE.txt.",
            "",
            "Complete corresponding source for this exact build is published at:",
            "  https://github.com/git-for-windows/git/releases/tag/$tag",
            "",
            "SHA-256 of the redistributable bundled here:",
            "  $sha"
          )
          Set-Content -Path (Join-Path $vendor "GIT-SOURCE-OFFER.txt") -Value $offer
          Write-Host "bundled Git staged into $vendor"

      - run: pyinstaller installer/svn2gitlab.spec --noconfirm --clean
      - name: Run the frozen binary
        run: |
          .\dist\svn2gitlab\svn2gitlab.exe version
          .\dist\svn2gitlab\svn2gitlab.exe --help

      - name: Prove the bundled Git works with no system Git present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The bundle is worthless if the tool cannot actually find it. Strip every
          # Git directory from PATH and confirm `doctor` still resolves a git - and
          # that the one it found lives inside our package, not elsewhere on the box.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)git' }) -join ';'
          if (Get-Command git.exe -ErrorAction SilentlyContinue) {
            throw "a system git is still on PATH; this check would prove nothing"
          }
          $report = & .\dist\svn2gitlab\svn2gitlab.exe doctor --json | ConvertFrom-Json
          if (-not $report.tools.git.available) {
            throw "the bundled Git was not found - the package is not self-contained"
          }
          Write-Host "bundled git resolved to: $($report.tools.git.path)"
          if ($report.tools.git.path -notmatch '(?i)svn2gitlab') {
            throw "doctor found a git outside the package: $($report.tools.git.path)"
          }
          if (-not $report.sources.tfvc.ready) {
            throw "TFVC migrations are not ready with only the bundled Git"
          }
          Write-Host "TFVC migrations are ready with no system Git installed."

      - name: Check the binary will load on Windows Server 2016
        run: python installer/check_os_floor.py dist/svn2gitlab/svn2gitlab.exe
      - uses: actions/upload-artifact@v4
        with:
          name: svn2gitlab-windows-unsigned
          path: dist/svn2gitlab/
          retention-days: 14
