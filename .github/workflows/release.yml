name: Release

# Builds the Windows installer and attaches it to a GitHub release when a version
# tag is pushed. The binaries are unsigned: a code-signing certificate is not
# something this repository can hold, and the release notes say so explicitly so
# nobody is surprised by a SmartScreen warning.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Subversion (needed by the test gate)
        run: choco install svn --no-progress -y

      - run: pip install -e ".[dev]"

      - name: Test before packaging
        run: pytest -q

      - name: Freeze with PyInstaller
        run: pyinstaller installer/svn2gitlab.spec --noconfirm --clean

      - name: Smoke-test the frozen binary
        run: .\dist\svn2gitlab\svn2gitlab.exe version

      - name: Build the installer
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\svn2gitlab.iss
        shell: pwsh

      - name: Package the portable build
        run: Compress-Archive -Path dist\svn2gitlab\* -DestinationPath dist\svn2gitlab-portable-windows-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/svn2gitlab-setup-*.exe
            dist/svn2gitlab-portable-windows-x64.zip

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows-installer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Build the Python distributions
        run: |
          pip install build
          python -m build

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/svn2gitlab-setup-*.exe
            dist/svn2gitlab-portable-windows-x64.zip
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## Install

            **Windows** — download `svn2gitlab-setup-<version>.exe` and run it, or
            unpack the portable zip anywhere.

            **Any platform** — `pip install svn2gitlab-<version>-py3-none-any.whl`

            Then run `svn2gitlab doctor` to check for Git, git-svn and Subversion.

            > The Windows binaries are **not code-signed**. SmartScreen will warn on
            > first run. Verify the checksums below against the build log if that
            > matters in your environment.

            See [docs/RUNBOOK.md](docs/RUNBOOK.md) for the migration procedure.
