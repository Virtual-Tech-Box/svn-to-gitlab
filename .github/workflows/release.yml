name: Release

# Builds the Windows installer and attaches it to a GitHub release when a version
# tag is pushed. The binaries are unsigned: a code-signing certificate is not
# something this repository can hold, and the release notes say so explicitly so
# nobody is surprised by a SmartScreen warning.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    # Pinned to the oldest Windows runner GitHub still offers. The binary must start
    # on Windows Server 2016, and a PE image built on a newer OS can stamp a newer
    # loader floor into itself. windows-2019 was retired, so 2022 is the floor
    # available to us - `check_os_floor.py` then proves the result is actually
    # loadable rather than assuming it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Subversion (needed by the test gate)
        run: choco install svn --no-progress -y

      - run: pip install -e ".[dev]"

      - name: Test before packaging
        run: pytest -q

      - name: Bundle Git (MinGit) into the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Downloaded at BUILD time and shipped inside the package, so installation
          # needs no internet at all. The client site runs behind a VPN that blocks
          # public DNS, where download-on-demand simply cannot work - and a migration
          # host is exactly the kind of machine that is locked down.
          #
          # MinGit is Git for Windows' own redistributable, published for embedding.
          # `git fast-import`, which the converter depends on, is a builtin of
          # git.exe rather than a separate binary, so MinGit is sufficient.
          $tag = "v2.55.0.windows.5"
          $name = "MinGit-2.55.0.5-64-bit.zip"
          $url = "https://github.com/git-for-windows/git/releases/download/$tag/$name"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile mingit.zip -MaximumRedirection 5
          $sha = (Get-FileHash mingit.zip -Algorithm SHA256).Hash
          Write-Host "MinGit SHA256: $sha"

          $vendor = "installer/vendor/git"
          if (Test-Path $vendor) { Remove-Item -Recurse -Force $vendor }
          New-Item -ItemType Directory -Path $vendor -Force | Out-Null
          Expand-Archive -Path mingit.zip -DestinationPath $vendor -Force

          foreach ($required in @("cmd/git.exe", "mingw64/bin/git.exe", "LICENSE.txt")) {
            if (-not (Test-Path (Join-Path $vendor $required))) {
              throw "MinGit is missing $required - refusing to ship an incomplete Git"
            }
          }
          # GPLv2 obliges us to ship the licence with the binary and to say where the
          # corresponding source is. Both travel with the package.
          Copy-Item (Join-Path $vendor "LICENSE.txt") (Join-Path $vendor "GIT-LICENSE.txt")
          # Built as an array rather than a here-string: PowerShell requires the
          # closing "@ at column zero, which cannot coexist with YAML indentation.
          $offer = @(
            "This package includes Git for Windows (MinGit) $name, unmodified.",
            "",
            "Git is free software under the GNU General Public License version 2.",
            "Its licence travels with this file as GIT-LICENSE.txt.",
            "",
            "Complete corresponding source for this exact build is published at:",
            "  https://github.com/git-for-windows/git/releases/tag/$tag",
            "",
            "SHA-256 of the redistributable bundled here:",
            "  $sha"
          )
          Set-Content -Path (Join-Path $vendor "GIT-SOURCE-OFFER.txt") -Value $offer
          Write-Host "bundled Git staged into $vendor"

      - name: Freeze with PyInstaller
        run: pyinstaller installer/svn2gitlab.spec --noconfirm --clean

      - name: Smoke-test the frozen binary
        run: .\dist\svn2gitlab\svn2gitlab.exe version

      - name: Check the binary will load on Windows Server 2016
        run: python installer/check_os_floor.py dist/svn2gitlab/svn2gitlab.exe

      - name: Prove the bundled Git works with no system Git present
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The bundle is worthless if the tool cannot actually find it. Strip every
          # Git directory from PATH and confirm `doctor` still resolves a git - and
          # that the one it found lives inside our package, not elsewhere on the box.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)git' }) -join ';'
          if (Get-Command git.exe -ErrorAction SilentlyContinue) {
            throw "a system git is still on PATH; this check would prove nothing"
          }
          $report = & .\dist\svn2gitlab\svn2gitlab.exe doctor --json | ConvertFrom-Json
          if (-not $report.tools.git.available) {
            throw "the bundled Git was not found - the package is not self-contained"
          }
          Write-Host "bundled git resolved to: $($report.tools.git.path)"
          if ($report.tools.git.path -notmatch '(?i)svn2gitlab') {
            throw "doctor found a git outside the package: $($report.tools.git.path)"
          }
          if (-not $report.sources.tfvc.ready) {
            throw "TFVC migrations are not ready with only the bundled Git"
          }
          Write-Host "TFVC migrations are ready with no system Git installed."

      - name: Check the pinned prerequisite URL still resolves
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The installer offers to download Git for Windows when it is missing. A
          # stale URL must fail here, loudly, rather than at a customer site.
          $iss = Get-Content installer\svn2gitlab.iss -Raw
          if ($iss -notmatch "GitInstallerUrl\s*=\s*'([^']+)'\s*\+\s*'([^']+)'") {
            throw "could not find GitInstallerUrl in the installer script"
          }
          $url = $Matches[1] + $Matches[2]
          Write-Host "checking $url"
          $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5
          if ($response.StatusCode -ne 200) { throw "prerequisite URL returned $($response.StatusCode)" }
          Write-Host "prerequisite URL OK"

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # `$env:ProgramFiles(x86)` does not parse: a parenthesised name needs
          # ${...}. Look the compiler up rather than hardcoding a path, and install
          # it if the runner image ever stops shipping it.
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              Write-Host "Inno Setup not found on the image; installing it"
              choco install innosetup --no-progress -y
              $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (-not $found) { throw "Inno Setup 6 could not be located or installed" }
            $iscc = $found
          }
          Write-Host "using $iscc"
          & $iscc installer\svn2gitlab.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Package the portable build
        shell: pwsh
        run: Compress-Archive -Path dist\svn2gitlab\* -DestinationPath dist\svn2gitlab-portable-windows-x64.zip

      - name: Verify the artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem dist\svn2gitlab-setup-*.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "no installer was produced" }
          $zip = Get-Item dist\svn2gitlab-portable-windows-x64.zip
          Write-Host ("installer: {0} ({1:N1} MB)" -f $setup.Name, ($setup.Length / 1MB))
          Write-Host ("portable:  {0} ({1:N1} MB)" -f $zip.Name, ($zip.Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/svn2gitlab-setup-*.exe
            dist/svn2gitlab-portable-windows-x64.zip

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows-installer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Build the Python distributions
        run: |
          pip install build
          python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum svn2gitlab-setup-*.exe svn2gitlab-portable-windows-x64.zip \
                    *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not draft: a draft is invisible on the public releases page,
          # so the artifacts would appear to be missing. The build only reaches this
          # step after the tests and the installer build have passed.
          draft: false
          # Anything with a suffix (-rc1, -beta) is published as a prerelease, so a
          # build cut for testing is never mistaken for a general release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/svn2gitlab-setup-*.exe
            dist/svn2gitlab-portable-windows-x64.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## Install

            **Windows** — download `svn2gitlab-setup-<version>.exe` and run it, or
            unpack the portable zip anywhere.

            **Any platform** — `pip install svn2gitlab-<version>-py3-none-any.whl`

            The installer offers to download and install **Git for Windows** if it
            is missing. Nothing else is required for a TFS/TFVC migration.

            ### Prerequisites

            | Migrating from | You need |
            | --- | --- |
            | **TFS / Azure DevOps (TFVC)** | Git only. History is read over HTTPS. |
            | **Subversion** | Git, plus `svn` and `svnadmin`. On a VisualSVN Server host these are already in `C:\Program Files\VisualSVN Server\bin`. |

            Run `svn2gitlab doctor` after installing: it reports which kinds of
            migration this machine can run, and exactly what any of them is missing.

            > The Windows binaries are **not code-signed**. SmartScreen will warn on
            > first run. `SHA256SUMS.txt` is attached, and the values are printed in
            > the build log for this release if you want to check them independently.

            See [docs/RUNBOOK.md](docs/RUNBOOK.md) for the migration procedure.
