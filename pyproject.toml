[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svn2gitlab"
version = "1.1.0rc1"
description = "Migrate any Subversion deployment to any GitLab deployment, with verifiable results"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Virtual Tech Box" }]
keywords = ["svn", "subversion", "gitlab", "git", "migration", "git-svn", "vcs", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Archiving :: Mirroring",
]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyinstaller>=6.5",
    # starlette's TestClient needs an HTTP transport, and which one depends on the
    # starlette version pip resolves: current releases require httpx2 (Python 3.10+),
    # older ones require httpx. Declare both so the web tests run on every supported
    # interpreter, including 3.9 where httpx2 is unavailable.
    "httpx>=0.24",
    "httpx2>=0.1; python_version >= '3.10'",
]

[project.scripts]
svn2gitlab = "svn2gitlab.cli:main"

[project.urls]
Homepage = "https://github.com/Virtual-Tech-Box/svn-to-gitlab"
Repository = "https://github.com/Virtual-Tech-Box/svn-to-gitlab"
Issues = "https://github.com/Virtual-Tech-Box/svn-to-gitlab/issues"
Changelog = "https://github.com/Virtual-Tech-Box/svn-to-gitlab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Virtual-Tech-Box/svn-to-gitlab/blob/main/docs/RUNBOOK.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svn2gitlab = ["web/templates/*.html", "web/static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that build real repositories"]
